[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-note"
version = "0.1.0"
description = "CLI tool for turning course videos into structured Markdown notes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "shaoeChen" }]
dependencies = [
  "typer>=0.12,<1.0",
  "scenedetect>=0.6.3,<1.0",
  "yt-dlp[default]>=2026.8.19",
]

[project.urls]
Repository = "https://github.com/shaoeChen/CourseNote"
Issues = "https://github.com/shaoeChen/CourseNote/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
whisper = [
  "faster-whisper>=1.0",
]
vision = [
  "opencv-python-headless>=4.8,<5.0",
]

[project.scripts]
course-note = "course_note.cli.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["course_note*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
